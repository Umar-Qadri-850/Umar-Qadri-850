<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Umar Qadri Banner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&display=swap');

  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
  }

  .banner {
    position: relative;
    width: 1600px;
    height: 450px;
    background: radial-gradient(ellipse at center, #071a10 0%, #000000 75%);
    overflow: hidden;
    border-radius: 6px;
    box-shadow: 0 0 60px rgba(0,255,140,0.15);
  }

  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.75) 100%);
    pointer-events: none;
  }

  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    pointer-events: none;
  }

  .frame {
    position: absolute;
    inset: 14px;
    border: 1px solid rgba(0,255,153,0.25);
    border-radius: 4px;
    pointer-events: none;
  }
  .frame::before, .frame::after,
  .corner-br, .corner-bl {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    border-color: #00ff99;
    border-style: solid;
  }
  .frame::before { top: -1px; left: -1px; border-width: 3px 0 0 3px; }
  .frame::after { top: -1px; right: -1px; border-width: 3px 3px 0 0; }
  .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 3px 3px; }
  .corner-br { bottom: -1px; right: -1px; border-width: 0 3px 3px 0; }

  .name {
    font-size: 68px;
    font-weight: 700;
    color: #eafff3;
    letter-spacing: 4px;
    text-shadow:
      0 0 8px #00ff99,
      0 0 22px #00ff99,
      0 0 50px rgba(0,255,153,0.6);
    margin: 0;
  }

  .role {
    font-size: 22px;
    color: #8cffc6;
    letter-spacing: 6px;
    margin-top: 10px;
    text-shadow: 0 0 10px rgba(140,255,198,0.6);
  }

  .stack {
    font-size: 18px;
    color: #4dffa8;
    letter-spacing: 4px;
    margin-top: 16px;
    opacity: 0.85;
  }

  .stack span.sep {
    color: #00ff99;
    margin: 0 10px;
    opacity: 0.6;
  }

  .prompt {
    position: absolute;
    bottom: 46px;
    font-size: 21px;
    color: #00ff88;
    text-shadow: 0 0 10px rgba(0,255,136,0.7);
    letter-spacing: 1px;
  }

  .cursor {
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .scanline {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,255,153,0.035) 0px,
      rgba(0,255,153,0.035) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    mix-blend-mode: screen;
  }
</style>
</head>
<body>

<div class="banner" id="banner">
  <canvas id="matrix"></canvas>
  <div class="vignette"></div>
  <div class="scanline"></div>
  <div class="frame"></div>
  <div class="corner-bl"></div>
  <div class="corner-br"></div>

  <div class="content">
    <h1 class="name">UMAR QADRI</h1>
    <div class="role">FULL STACK DEVELOPER</div>
    <div class="stack">ANGULAR<span class="sep">•</span>AI<span class="sep">•</span>THREE.JS<span class="sep">•</span>PYTHON</div>
    <div class="prompt">&gt; npm run dev <span class="cursor">█</span></div>
  </div>
</div>

<script>
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  const W = 1600, H = 450;
  canvas.width = W;
  canvas.height = H;

  const fontSize = 16;
  const columns = Math.floor(W / fontSize);
  const drops = new Array(columns).fill(0).map(() => Math.random() * -H / fontSize);
  const speeds = new Array(columns).fill(0).map(() => 0.4 + Math.random() * 0.9);

  const chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノ01ABCDXYZ$#&%!?<>/\\";

  function draw() {
    // fading trail
    ctx.fillStyle = "rgba(0, 5, 2, 0.18)";
    ctx.fillRect(0, 0, W, H);

    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < columns; i++) {
      const char = chars[Math.floor(Math.random() * chars.length)];
      const x = i * fontSize;
      const y = drops[i] * fontSize;

      // brighter leading character
      ctx.fillStyle = "#c6ffe3";
      ctx.fillText(char, x, y);

      // green trailing glow character
      ctx.fillStyle = "rgba(0, 255, 140, 0.55)";
      const trailChar = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(trailChar, x, y - fontSize);

      if (y > H && Math.random() > 0.975) {
        drops[i] = Math.random() * -20;
      }
      drops[i] += speeds[i];
    }

    requestAnimationFrame(draw);
  }

  draw();
</script>

</body>
</html>