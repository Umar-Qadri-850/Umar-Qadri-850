<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="60"
     viewBox="0 0 1200 60">
<defs>
  <linearGradient id="lineFadeL" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
    <stop offset="15%" stop-color="#00ff88" stop-opacity="1"/>
    <stop offset="100%" stop-color="#00ffc8" stop-opacity="1"/>
  </linearGradient>
  <linearGradient id="lineFadeR" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00ffc8" stop-opacity="1"/>
    <stop offset="85%" stop-color="#00ff88" stop-opacity="1"/>
    <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00ffc8"/>
    <stop offset="50%" stop-color="#00ff88"/>
    <stop offset="100%" stop-color="#00ffc8"/>
  </linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="1.5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<style>
  .line {
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-dasharray: 6 10;
    filter: url(#softGlow);
    animation: dash 6s linear infinite;
  }
  .lineL { stroke: url(#lineFadeL); }
  .lineR { stroke: url(#lineFadeR); }

  .center {
    fill: url(#textGrad);
    font-size: 14px;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-weight: 600;
    letter-spacing: 5px;
    filter: url(#glow);
    animation: flicker 4s ease-in-out infinite;
  }

  .dot {
    fill: #00ff88;
    filter: url(#glow);
    transform-origin: center;
    transform-box: fill-box;
    animation: pulse 1.8s ease-in-out infinite;
  }
  .d1 { animation-delay: 0s; }
  .d2 { animation-delay: .2s; }
  .d3 { animation-delay: .4s; }
  .d4 { animation-delay: .6s; }
  .d5 { animation-delay: .8s; }
  .d6 { animation-delay: 1s; }

  .ring {
    fill: none;
    stroke: #00ff88;
    stroke-width: 1;
    opacity: .35;
    filter: url(#softGlow);
    animation: ripple 3s ease-out infinite;
  }

  @keyframes dash {
    to { stroke-dashoffset: -320; }
  }
  @keyframes pulse {
    0%, 100% { opacity: .35; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.6); }
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    50% { opacity: .82; }
  }
  @keyframes ripple {
    0% { r: 4; opacity: .5; }
    100% { r: 22; opacity: 0; }
  }
</style>

<!-- left flowing line -->
<line x1="30" y1="30" x2="470" y2="30" class="line lineL"/>

<!-- left dot cluster -->
<circle cx="500" cy="30" r="3" class="dot d1"/>
<circle cx="520" cy="30" r="3" class="dot d2"/>
<circle cx="540" cy="30" r="3" class="dot d3"/>

<!-- center emblem -->
<circle cx="600" cy="30" r="4" class="ring"/>
<text x="600" y="35" text-anchor="middle" class="center">SYSTEM ONLINE</text>

<!-- right dot cluster -->
<circle cx="660" cy="30" r="3" class="dot d4"/>
<circle cx="680" cy="30" r="3" class="dot d5"/>
<circle cx="700" cy="30" r="3" class="dot d6"/>

<!-- right flowing line -->
<line x1="730" y1="30" x2="1170" y2="30" class="line lineR"/>

</svg>